name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system GUI testing dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile quantumlab.py
      - name: GUI smoke tests
        run: xvfb-run -a python -m unittest discover -s tests -v
